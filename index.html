<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="preconnect" href="https://vqehwhdlujoajuqunyzu.supabase.co" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#C41E2E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Espetinho Vitoria" />
  <title>Espetinho Vitória | Espetos, Açaí e Caldos</title>
  <meta name="description"
    content="Os melhores espetinhos, açaí e caldos da região. Qualidade e sabor que você já conhece!" />

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Espetinho Vitória" />
  <meta property="og:description" content="Espetos, Açaí e Caldos. Peça agora!" />
  <meta property="og:image" content="/logo.png" />
  <meta property="og:type" content="website" />
  <!-- PWA Dynamic Manifest -->
  <link rel="apple-touch-icon" href="/logo.png">
  <script>
    const isDriver = window.location.pathname.startsWith('/entregador');

    (function () {
      const origin = window.location.origin;
      const path = window.location.pathname;
      const pathParts = path.split('/');
      const customerCode = pathParts.find(p => p.startsWith('CLI-'));

      let manifest = null;

      if (isDriver) {
        manifest = {
          "name": "Espetinho Entregas",
          "short_name": "Entregas",
          "description": "Painel do entregador - Espetinho Vitória",
          "theme_color": "#1A1A1A",
          "background_color": "#F5F5F7",
          "display": "standalone",
          "start_url": origin + "/entregador",
          "scope": origin + "/entregador",
          "icons": [
            { "src": origin + "/logo.png", "sizes": "192x192", "type": "image/png" },
            { "src": origin + "/logo.png", "sizes": "512x512", "type": "image/png" },
            { "src": origin + "/logo.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
          ]
        };
      } else if (customerCode) {
        manifest = {
          "name": "Espetinho Vitoria",
          "short_name": "Espetinho",
          "description": "Os melhores espetinhos, açaí e caldos da região.",
          "theme_color": "#C41E2E",
          "background_color": "#ffffff",
          "display": "standalone",
          "start_url": origin + "/" + customerCode,
          "icons": [
            { "src": origin + "/logo.png", "sizes": "192x192", "type": "image/png" },
            { "src": origin + "/logo.png", "sizes": "512x512", "type": "image/png" },
            { "src": origin + "/logo.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
          ]
        };
      }

      if (manifest) {
        const stringManifest = JSON.stringify(manifest);
        const manifestDataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(stringManifest);

        let link = document.querySelector('link[rel="manifest"]');
        if (!link) {
          link = document.createElement('link');
          link.rel = 'manifest';
          document.head.appendChild(link);
        }
        link.href = manifestDataUrl;
      }
    })();

    // OneSignal initialization (Simplified as requested)
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function (OneSignal) {
      console.log("[OneSignal] Starting initialization...");
      try {
        await OneSignal.init({
          appId: "3cffc84b-c412-49a6-bccb-a108981a4ef3",
          allowLocalhostAsSecureOrigin: true,
          autoResubscribe: true,
          notifyButton: { enable: false },
          serviceWorkerParam: { scope: "/" },
          serviceWorkerPath: "/OneSignalSDKWorker.js",
        });

        // Tag users on the driver route
        if (window.location.pathname.startsWith('/entregador')) {
          await OneSignal.User.addTag("user_type", "entregador");
          console.log("[OneSignal] Tag 'user_type: entregador' applied");
        }

        OneSignal.User.PushSubscription.addEventListener("change", (event) => {
          console.log("[OneSignal] Subscription changed:", event.current);
        });

        const id = OneSignal.User.PushSubscription.id;
        console.log("[OneSignal] Initialized. Subscription ID:", id || "None (Not subscribed yet)");
      } catch (e) {
        console.error("[OneSignal] Init error:", e);
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
